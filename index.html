<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hệ Thống Nhập Form Học Sinh Đi Nhật</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            font-family: 'Segoe UI', 'Noto Sans JP', sans-serif;
        }

        .portal-card {
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .portal-card:hover {
            transform: translateY(-6px);
            box-shadow: 0 20px 35px -10px rgba(0, 0, 0, 0.25);
        }
    </style>
</head>

<body class="bg-gradient-to-br from-blue-50 via-white to-indigo-50 min-h-screen flex flex-col">

    <div class="flex-1 flex flex-col items-center justify-center px-4 py-12">
        <div class="text-center mb-12">
            <h1 class="text-3xl md:text-4xl font-extrabold text-gray-800 mb-3">
                🇯🇵 Hệ Thống Nhập Form Học Sinh Đi Nhật
            </h1>
            <p class="text-gray-500 text-sm md:text-base">
                Chọn loại form bạn muốn nhập dữ liệu
            </p>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-8 w-full max-w-4xl">
            <!-- Card 1: Form Phổ Thông -->
            <a href="pho-thong/index.html"
                class="portal-card block bg-white rounded-2xl shadow-lg border border-gray-100 p-8 text-center">
                <div class="text-6xl mb-4">📘</div>
                <h2 class="text-xl font-bold text-blue-700 mb-2">Form Phổ Thông</h2>
                <p class="text-sm text-gray-500 mb-4">TRAENCO / GICC</p>
                <span
                    class="inline-block bg-blue-600 text-white font-semibold px-6 py-2.5 rounded-lg shadow hover:bg-blue-700 transition">
                    Mở Form →
                </span>
            </a>

            <!-- Card 2: Form Nghiệp Đoàn SCI -->
            <a href="sci/index.html"
                class="portal-card block bg-white rounded-2xl shadow-lg border border-gray-100 p-8 text-center">
                <div class="text-6xl mb-4">📙</div>
                <h2 class="text-xl font-bold text-indigo-700 mb-2">Form Nghiệp Đoàn SCI</h2>
                <p class="text-sm text-gray-500 mb-4">Dành riêng cho Nghiệp Đoàn SCI</p>
                <span
                    class="inline-block bg-indigo-600 text-white font-semibold px-6 py-2.5 rounded-lg shadow hover:bg-indigo-700 transition">
                    Mở Form →
                </span>
            </a>
        </div>
    </div>

    <footer class="text-center text-xs text-gray-400 pb-6">
        © Hệ Thống Nhập Form Học Sinh Đi Nhật
    </footer>

</body>

</html>
